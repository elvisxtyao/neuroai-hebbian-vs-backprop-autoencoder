name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-only:
    name: Artifact-only QA (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install artifact-only dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-release.txt

      - name: Verify frozen release evidence
        run: python scripts/verify_final_release.py

      - name: Run release-safe tests
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_final_release_bundle.py
          tests/test_final_figures.py
          tests/test_release_narrative.py
          tests/test_phase4_reproducibility.py
          tests/test_release_archive.py
          tests/test_ci_workflows.py

      - name: Run clean-export QA
        run: python scripts/qa_clean_export.py
