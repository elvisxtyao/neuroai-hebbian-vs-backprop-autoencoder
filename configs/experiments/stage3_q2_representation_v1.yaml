version: stage3-q2-representation-v1
source_protocol: configs/experiments/stage3_formal_core_v1.yaml
seeds: [0, 1, 2, 3, 4]
methods:
  full_bp:
    label: BBB
    results_root: results/formal/phase0_v1_1/stage3_core
  full_hebbian:
    label: HHH
    results_root: results/formal/phase0_v1_1/stage3_core
  hybrid_hhb:
    label: HHB
    results_root: results/formal/phase0_v1_1/stage3_core
  hybrid_hbb:
    label: HBB
    results_root: results/formal/phase0_v1_1/stage3_core
  random_hbb:
    label: RBB
    results_root: results/formal/phase0_v1_1/stage3_matched_controls
  random_rrb:
    label: RRB
    results_root: results/formal/phase0_v1_1/stage3_matched_controls
data:
  root: data/raw
  split: official_test
  subset_seed: 17
  samples_per_class: 200
  batch_size: 128
analysis:
  layers: [h1, h2, z]
  activation_epsilon: 1.0e-12
  winner_fraction: 0.10
  cv_folds: 5
  cv_seed: 17
  knn_neighbors: 5
  pca_components: 50
  pca_seed: 17
  umap:
    n_neighbors: 15
    min_dist: 0.1
    spread: 1.0
    metric: euclidean
    random_state: 17
    epochs: 200
    negative_samples: 5
  representation_storage_dtype: float16
output_dir: results/formal/phase0_v1_1/stage3_q2_representation
